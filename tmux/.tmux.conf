###
# Global options and behavior
###
set-option -g default-terminal "screen-256color"
set-option -g terminal-overrides ",xterm-256color:RGB"
#set -g prefix ^A
set -g mouse on
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 10000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -g default-terminal "${TERM}"
# monitor activity will highlight the window if there is activity see `catppuccin_window_flags`
setw -g monitor-activity on
# set vi mode for navigation in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
# Home and End keys don't work without this
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"
# split panes in current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

###
# List of plugins
###
set -g @plugin "tmux-plugins/tpm"
# tmux-sensible configures a bunch of sane defaults
# TODO: investigate options
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "catppuccin/tmux"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @yank_action 'copy-pipe-no-clear'
set -g @plugin "fcsonline/tmux-thumbs"
# tmux-resurrect saves the state of a tmux session
set -g @plugin "tmux-plugins/tmux-resurrect"
# tmux-continuum continuously calls resurrect every 15 minutes
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "sainnhe/tmux-fzf"
# set -g @plugin "wfxr/tmux-fzf-url"
# set -g @plugin "alexwforsythe/tmux-which-key"

###
# catppuccin settings
###
# https://github.com/catppuccin/tmux/discussions/317
set -g @catppuccin_flavor "mocha"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %d-%m-%Y #[bg=#{@thm_yellow},fg=#{@thm_crust}] 󰥔  #[bg=#{@thm_surface_0},fg=#{@thm_fg}] %H:%M"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_status_style "rounded"
# colors
set -g @catppuccin_window_text_color "#{E:@thm_surface_0}"
set -g @catppuccin_window_number_color "#{E:@thm_overlay_2}"
set -g @catppuccin_window_current_text_color "#{E:@thm_lavender}"
set -g @catppuccin_window_current_number_color "#{E:@thm_green}"
set -g @catppuccin_window_number_color "#{E:@thm_overlay_2}"
# window titles
# set -g @catppuccin_window_current_text "#(~/.local/bin/compress_path.sh #{pane_current_path})"
# set -g @catppuccin_window_text "#(~/.local/bin/compress_path.sh #{pane_current_path})"
# set -g @catppuccin_window_current_text "#{pane_current_command}   #(~/.local/bin/compress_path.sh #{pane_current_path})"
# set -g @catppuccin_window_text "#{pane_current_command}   #(~/.local/bin/compress_path.sh #{pane_current_path})"
set -g @catppuccin_window_current_text "#[fg=#{@thm_crust}]#{pane_current_command}   #(~/.local/bin/compress_path.sh #{pane_current_path})"
set -g @catppuccin_window_text "#{pane_current_command}   #(~/.local/bin/compress_path.sh #{pane_current_path})"

# Icons in window
set -ogq @catppuccin_window_flags "icon"
set -ogq @catppuccin_window_flags_icon_last "" # -
# set -ogq @catppuccin_window_flags_icon_current " " # *
set -ogq @catppuccin_window_flags_icon_current ""
set -ogq @catppuccin_window_flags_icon_zoom " 󰁌" # Z
set -ogq @catppuccin_window_flags_icon_mark " 󰃀" # M
set -ogq @catppuccin_window_flags_icon_silent " 󰂛" # ~
set -ogq @catppuccin_window_flags_icon_activity " 󱅫" # #
set -ogq @catppuccin_window_flags_icon_bell " 󰂞" # !
# Matches icon order when using `#F` (`#!~[*-]MZ`)
set -ogq @catppuccin_window_flags_icon_format "##{?window_activity_flag,#{E:@catppuccin_window_flags_icon_activity},}##{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},}##{?window_silence_flag,#{E:@catppuccin_window_flags_icon_silent},}##{?window_active,#{E:@catppuccin_window_flags_icon_current},}##{?window_last_flag,#{E:@catppuccin_window_flags_icon_last},}##{?window_marked_flag,#{E:@catppuccin_window_flags_icon_mark},}##{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},} "

# Status line options
set -ogq @catppuccin_status_left_separator ""
set -ogq @catppuccin_status_middle_separator ""
set -ogq @catppuccin_status_right_separator " "
set -ogq @catppuccin_status_connect_separator "yes" # yes, no

# Catppuccin!!!
run ~/.tmux/plugins/tmux/catppuccin.tmux

###
# Resurrect settings
###
set -g @resurrect-strategy-nvim "session"

###
# Continuum settings
###
set -g @continuum-restore "off"

###
# Platform specific settings
###
if-shell "uname | grep -q Darwin" {
    set -g @thumbs-command "echo -n {} | pbcopy"
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "pbcopy"
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    set -g @thumbs-command "echo -n {} | xclip -selection clipboard"
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "xclip -in selection clipboard"
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in selection clipboard"
}

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"
