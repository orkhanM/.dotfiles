# History
scrollback_lines 1000000

# Font settings
font_size 12.0

# Appearance
hide_window_decorations no
tab_bar_min_tabs 2

window_padding_width 0

# Key bindings
# OPT/ALT-Left and OPT/ALT-Right for word navigation (matches Terminal.app behavior)
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf

# Tab navigation (matches wezterm)
map ctrl+page_up previous_tab
map ctrl+page_down next_tab

# Move tab position (matches wezterm)
map ctrl+shift+page_up move_tab_backward
map ctrl+shift+page_down move_tab_forward

# Cursor
cursor_shape block
shell_integration no-cursor

# Rendering
repaint_delay 8
input_delay 2

# Transparency (opaque by default, toggle with kitty @ set-background-opacity)
background_opacity 0.95

# Enable remote control for transparency toggling
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# macOS specific
macos_window_background_blur 40

# Catppuccin Mocha theme (inlined to avoid symlink resolution issues with macOS .app)
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc
cursor                  #f5e0dc
cursor_text_color       #1e1e2e
scrollbar_handle_color  #9399b2
scrollbar_track_color   #45475a
url_color               #f5e0dc
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af
wayland_titlebar_color  system
macos_titlebar_color    system
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b
